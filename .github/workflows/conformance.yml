name: conformance

# Proves the README's portability claim ("any CPython 3.12") by running the
# in-process conformance suites on Linux, macOS, and Windows. The sealed
# subprocess-ABI mode is deliberately excluded: it pins the Windows CPython
# embeddable and is not portable by construction (see baseline-run/RUNBOOK.md).
# Each runner exits nonzero on any conformance failure, so a red job is a real
# regression, not a flake.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Accepted 0.2 suite (in-process, 798 checks)
        run: python -B baseline-run/implementation-output-0.2/run_conformance_0_2.py
      - name: Composed 0.2 + 0.3 suite (in-process, 905 checks)
        run: python -B baseline-run/implementation-output-0.3/run_conformance_0_3.py --suite all
