[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "receiver-reliance"
version = "1.3.0.dev0"
description = "Deterministic, auditable receiver-side reliance decisions for agent handoffs, re-derivable from published bytes."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "James Dimachkie" }]
keywords = [
    "agent-handoff",
    "conformance-testing",
    "decision-auditing",
    "determinism",
    "multi-agent-systems",
    "reproducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
# [project.urls] is added in the post-transfer commit: the URLs bake the repo
# owner into any published wheel, and the owner changes at the ticket-09 org
# transfer. No console script at 1.3.0 (nothing importable stands behind one);
# no py.typed (annotation coverage unmeasured -- ship the marker only after a
# measured pass, or it publishes a false claim).

[tool.setuptools]
packages = ["receiver_reliance"]

[tool.setuptools.package-data]
# engine_manifest.json is the integrity gate; _engine/ is the derived copy a
# self-contained wheel carries. Stage it first:
#   python -B receiver_reliance/generate_engine_manifest.py --stage
receiver_reliance = ["engine_manifest.json", "_engine/**/*"]

# Supported integration mode today: editable install from a repo checkout
# (`pip install -e .`). The package locates the frozen engine and contracts
# relative to the checkout; a self-contained wheel (bundling the sealed
# contract/fixture data) is produced by staging the engine into the package
# and building normally; see row A7 of ADOPTION.md.
